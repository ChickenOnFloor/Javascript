<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="d-container">
            <div class="d-card">
                <div class="upload-div">
                    <img src="" alt="" class="showImg">
                    <label for="file-upload" class="upload">Upload a Photo</label>
                    <input type="file" id="file-upload">
                </div>
                <div class="item">
                    <label>Item Name</label>
                    <input type="text" placeholder="ex.IPhone 16" class="dashName">
                </div>
                <div class="item">
                    <label>Item Price</label>
                    <input type="text" placeholder="ex.100" class="dashPrice">
                </div>
                <div class="item">
                    <label>Select Category</label>
                    <select class="selectedValue">
                    </select>
                </div>
                <button class="dashUpload">Upload</button>
            </div>
            <div class="di-list">
                <div class="dlist-col">
                    <label for="">Image</label>
                    <label for="">Name</label>
                    <label for="">Price</label>
                    <label for="">Category</label>
                    <label for="">Activity</label>
                </div>
                <div class="owner-items">
                    
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

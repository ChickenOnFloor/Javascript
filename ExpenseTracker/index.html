<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body>
    <div class="main">
        <div class="container">
            <div class="inputs">
                <input type="text" placeholder="Item" class="item">
                <input type="text" placeholder="Cost" class="cost">
                <button class="add">ADD</button>
            </div>
            <div class="total">
                <h3>ITEM</h3>
                <h3>COST</h3>
            </div>
            <div class="cards">
                
            </div>
            <div class="total">
                <h3>Total</h3>
                <h3 class="totalCost">0</h3>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
